%%html
<!DOCTYPE html>
<html>
  <head>
    <style>
      #grid {
        display: grid;
        gap: 5px;
      }
      .cell {
        border: 1px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="grid"></div>
    <script>
      const colors = ["#ff8080", "#ffa880", "#ffff80", "#80ff80", "#80ffff", "#80a8ff", "#a880ff", "#ff80a8"]
      const colorpos = [0, 1, 2, 3, 4, 5, 6, 7, 0, 1, 2, 3, 4, 5, 6, 7]
      function generateGrid(n) {
        const grid = document.getElementById('grid');

        grid.innerHTML = '';

        grid.style.gridTemplateColumns = `repeat(${n}, 40px)`;

        const totalCells = n * n;
        for (let i = 1; i <= totalCells; i++) {
          const cell = document.createElement('div');
          cell.style.backgroundColor = colors[colorpos[i-1]]
          cell.className = 'cell';
          grid.appendChild(cell);
        }
      }
      generateGrid(4);
    </script>
  </body>
</html>
