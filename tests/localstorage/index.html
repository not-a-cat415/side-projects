<!DOCTYPE html>
<html lang="en">
  <p id="stored"></p>
  <button onclick="countup()">Count Up</button>
  <script>
    const counter = document.getElementById("stored")
    let ncounter = 0
    if (localStorage.count === undefined) {
      localStorage.count = 0
    }
    else {
      ncounter = localStorage.count
    }
    counter.innerHTML = ncounter
    function countup() {
      ncounter += 1
      counter.innerHTML = ncounter
      localStorage.count = ncounter
    }
  </script>
</html>
