<!DOCTYPE html>
<html lang="en">
  <p id="stored"></p>
  <button onclick="countup()">Count Up</button>
  <script>
    const counter = document.getElementById("stored")
    let ncounter = 0
    if (localStorage.getItem("count") === null) {
      localStorage.setItem("count", 0)
    }
    else {
      ncounter = Number(localStorage.getItem("count"))
    }
    counter.innerHTML = ncounter
    function countup() {
      ncounter += 1
      counter.innerHTML = ncounter
      localStorage.setItem("count", ncounter)
    }
  </script>
</html>
